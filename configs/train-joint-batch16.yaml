prompt:
  system: |-
    You are a rating assistant. You will receive an image and its corresponding text description.
    Assess them together according to the provided scoring criteria. Give a concise explanation
    supported by the image and text; do not invent missing details.
    The final response is a JSON object with exactly two fields: "reasoning" (a string) and
    "rating" (a number from 0 to 9). Complete the reasoning for the supplied rating;
    the application assembles the final JSON response.
# Batch-16 reference for fresh, single-factor scoring experiments.
# Head and score weight can also be overridden with --score-head / --score-weight.
model:
  name_or_path: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16  # Full 2B backward verified on this M4 Pro; --dtype float32 is the fallback.
  attn_implementation: sdpa
  min_pixels: 4096
  max_pixels: 65536
objective:
  head_type: regression  # regression (normalized Huber) or classification (10-class CE)
  score_weight: 1.0  # Multiplies only the scoring loss; logged score_loss is unweighted.
  rationale_weight: 0.1
  huber_delta: 0.1
  score_min: 0.0
  score_max: 9.0
  ce_chunk_size: 32
data:
  directory: data/training_data/v5
  train_file: train.jsonl
  validation_file: validation.jsonl
  max_train_samples: null
  max_eval_samples: null
  max_length: 1024
  max_reasoning_tokens: 128
lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
runtime:
  device: auto
  mps_memory_fraction: 0.75
training:
  output_dir: artifacts/training/qwen3-vl-2b-joint-batch16
  num_train_epochs: 2
  max_steps: -1
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 0.0001
  logging_steps: 1
  eval_steps: 50
  save_steps: 100
  save_total_limit: 2
  gradient_checkpointing: true
  dataloader_num_workers: 0
  seed: 42
  generate_eval: false  # Optional final rationale generation using PREDICTED scores.
  repetition_eval: true  # One W&B curve: validation/reasoning_rep4, at every eval.
  max_new_tokens: 129  # 128 supervised body tokens plus one EOS.
wandb:
  project: multimodal-judge
  entity: null
  mode: disabled
  name: null
