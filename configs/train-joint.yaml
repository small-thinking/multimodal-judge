prompt:
  system: 'You are an AV cover rater. Score 0-9 from the cover image and title only. Do not invent scenes that are not visible or stated.

Goal: filter low-quality content. Prefer East-Asian innocent/pretty faces, real amateur feel, real penetration/creampie, and high-quality FFMs (2 women + 1 man). Attractive mature women and high-quality commercial "innocent face" titles are also acceptable.
Dislike: one woman with multiple men, heavy SM, dark/no-face/blurry shots. Solo toys and girl-girl are slightly lower unless the face and quality are strong.

Cover rule: amateur covers may be selfies, masks, or daily photos with no nudity; use the title to judge if real sex is likely. For commercial covers, use the main image plus inset sex shots. Penalize a large mismatch between title and image. Commercial titles score about 1 point lower than similar amateur ones.

Write a short reasoning in this order:
1) what the image shows (people, nudity/insertion, face clarity, lighting)
2) title alignment
3) style (amateur vs commercial)
4) theme
5) face/body
6) plus/minus points

Score anchors:
0-2 no face, extremely dark, blurry, or bad theme
3-4 one woman + multiple men, or average commercial/SM with no insertion highlight
5-6 pretty face but only breast-shake/toys/daily photos plus a suggestive title; or average commercial with insertion
7-8 clear innocent/pretty face plus strong amateur realism or high-quality insertion/contrast
9 reserved for an exceptional innocent face plus real penetration or high-quality FFM

Output JSON only: {"reasoning":"...","rating":N}'
    
# Run from the repository root. Configurable scoring + bounded rationale SFT.
model:
  name_or_path: Qwen/Qwen3-VL-2B-Instruct
  dtype: bfloat16  # Full 2B backward verified on this M4 Pro; --dtype float32 is the fallback.
  attn_implementation: sdpa
  min_pixels: 4096
  max_pixels: 65536
objective:
  head_type: regression  # regression (normalized Huber) or classification (10-class CE)
  regression_loss: mse
  score_weight: 1.0  # Multiplies only the scoring loss; logged score_loss is unweighted.
  rationale_weight: 0.1
  huber_delta: 0.1
  score_min: 0.0
  score_max: 9.0
  ce_chunk_size: 32
data:
  directory: data/training_data/data-refresh-20260909T210343Z
  train_file: train_original.jsonl
  validation_file: validation.jsonl
  max_train_samples: null
  max_eval_samples: null
  max_length: 1024
  max_reasoning_tokens: 128
lora:
  enabled: true
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules: [q_proj, v_proj]
runtime:
  device: auto
  mps_memory_fraction: 0.75
training:
  output_dir: artifacts/training/qwen3-vl-2b-joint
  num_train_epochs: 10
  max_steps: -1
  per_device_train_batch_size: 16
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.0e-4
  logging_steps: 1
  eval_steps: 25
  save_steps: 25
  save_total_limit: 20
  gradient_checkpointing: true
  dataloader_num_workers: 0
  seed: 42
  generate_eval: false  # Optional final rationale generation using PREDICTED scores.
  max_new_tokens: 128
wandb:
  project: multimodal-judge
  entity: techtao-small-thinking
  mode: online
  name: null
