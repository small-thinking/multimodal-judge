services:
  cpu:
    image: multimodal-judge:cpu
    build:
      context: .
      target: cpu
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./artifacts:/app/artifacts
      - model-cache:/app/cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
  gpu:
    image: multimodal-judge:cuda
    profiles: [gpu]
    platform: linux/amd64
    build:
      context: .
      target: cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    shm_size: 2gb
    volumes:
      - ./data:/app/data:ro
      - ./configs:/app/configs:ro
      - ./artifacts:/app/artifacts
      - model-cache:/app/cache
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
      WANDB_API_KEY: ${WANDB_API_KEY:-}
volumes:
  model-cache:
